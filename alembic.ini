[alembic]
# Las migraciones viven adentro del paquete para viajar en el wheel; este
# `alembic.ini` es solo para correr alembic parado en la raiz del repo (por
# ejemplo `alembic revision --autogenerate -m "..."`). Un consumidor instalado
# con pip usa `libraauth-migrar`, que arma el Config en memoria y resuelve la
# ruta desde `__file__`.
script_location = libraauth/migrations
# Placeholder a proposito: el destino real llega por DATABASE_URL. Ver
# libraauth/migrations/env.py.
sqlalchemy.url = postgresql://user:password@localhost/libraauth

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
