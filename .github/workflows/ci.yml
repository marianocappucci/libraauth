name: CI

on:
  # Sin `push` a ramas: `develop` y `main` estan protegidas (2026-08-11,
  # `enforce_admins: true`), asi que todo entra por PR y el run del PR verifica
  # el MERGE -- que es exactamente lo que queda en la rama. El push repetia esa
  # misma verificacion sobre un arbol identico: medido, tres commits distintos
  # con el mismo tree hash y hasta cuatro corridas por cambio.
  push:
    tags: ["v*"]   # dispara el release, no la verificacion
  pull_request:
    branches: [develop, main]

# Una sola corrida viva por rama. Si entra un push nuevo mientras esta
# corriendo, se cancela la anterior en vez de pagar las dos: su resultado ya
# no le sirve a nadie, porque reporta sobre un codigo que no es el que quedo
# en la rama.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # 🔴 `postgres:16-ALPINE` a proposito, no la imagen Debian. Es la misma que
    # corren los sidecars del VPS, y la diferencia no es cosmetica: Alpine usa
    # musl, que no implementa locales, asi que `en_US.utf8` colaciona por bytes
    # -- igual que el BINARY de SQLite. Con la imagen glibc el mismo collation
    # declarado ordena distinto, y `test_el_orden_por_username_es_el_de_bytes_
    # y_no_el_del_locale` se pone rojo. Medido el 2026-08-09.
    #
    # O sea: este CI prueba contra lo que hay en produccion. Si algun dia los
    # sidecars cambian de imagen, hay que cambiarla ACA tambien o el gate deja
    # de decir la verdad.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: libraauth
          POSTGRES_USER: libraauth_ci
          POSTGRES_PASSWORD: libraauth_ci_only
        options: >-
          --health-cmd "pg_isready -U libraauth_ci -d libraauth"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      LIBRAAUTH_POSTGRES_URL: postgresql+psycopg://libraauth_ci:libraauth_ci_only@localhost:5432/libraauth

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # F1 (2026-09-05): el entorno sale de `uv.lock`, no de la resolucion del dia.
      # `--locked` falla si el lock no coincide con pyproject.toml: un pin que se
      # mueve sin regenerar el lock pone rojo aca, no en produccion. El venv entra
      # al PATH para que los pasos siguientes (ruff, pytest, alembic, scripts)
      # sigan invocandose igual que antes.
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.10"
      - name: Install package + dev deps (uv.lock)
        run: |
          uv sync --locked --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # Lint antes que los tests: tarda segundos y su rojo se lee mucho mas
      # facil que el de una suite. El ruleset vive en pyproject.toml y esta
      # CURADO para dar cero hallazgos hoy en los 12 repos de la familia --
      # ver el comentario largo ahi. Un rojo aca es una regresion, no deuda.
      - name: Lint (ruff)
        run: ruff check .

      # `--cov` sin argumento toma el paquete de [tool.coverage.run] del
      # pyproject. El piso (fail_under) tambien esta ahi: es un trinquete
      # fijado 2 puntos debajo de lo medido el 2026-07-31, no una meta.
      # Que el gate de PostgreSQL no se saltee en silencio. `test_postgres_real`
      # se auto-saltea sin `LIBRAAUTH_POSTGRES_URL`, que es lo correcto para una
      # corrida local -- pero en CI un salteo se lee como verde y el gate no
      # estaria probando nada. Si el servicio no levanto, esto falla ACA, con un
      # mensaje que lo dice, en vez de dejar pasar la suite entera.
      - name: Verificar que el PostgreSQL del CI responde
        run: |
          python - <<'PY'
          import os, sys
          import psycopg
          url = os.environ["LIBRAAUTH_POSTGRES_URL"].replace(
              "postgresql+psycopg://", "postgresql://", 1)
          with psycopg.connect(url) as c:
              v = c.execute("select version()").fetchone()[0]
          print(v)
          if "PostgreSQL" not in v:
              sys.exit("el servicio no contesto como PostgreSQL")
          PY

      - name: Run tests
        run: pytest -v --cov --cov-report=term-missing

      # Contraprueba del salteo: que los tests contra PostgreSQL real hayan
      # CORRIDO. Un `-m pytest` que colecta cero por un skip sale con codigo 0 y
      # se lee igual que un verde -- ya paso en esta familia, con un filtro que
      # no matcheaba nada.
      - name: Confirmar que el gate de PostgreSQL corrio
        run: |
          # `pipefail` porque el `tee` se come el codigo de salida de pytest:
          # sin esto, un gate en rojo llega aca como exito.
          set -o pipefail
          # Los DOS archivos que dependen de PostgreSQL real. El de rate
          # limiting se suma el 2026-08-22: tiene el mismo `skipif`, así que
          # sin nombrarlo acá podría auto-saltearse y nadie se enteraría — que
          # es exactamente contra lo que existe este paso.
          pytest tests/test_postgres_real.py tests/test_rate_limiting_ts_texto.py \
            -q --no-cov -p no:cacheprovider \
            | tee /tmp/pg_gate.txt

          # Los dos chequeos van como `if`, no como `grep ... && { exit 1; }`:
          # con `set -e`, ese compound devuelve el fallo del grep cuando NO
          # matchea -- o sea, en el caso bueno -- y el paso se cae solo.
          if ! grep -qE '[0-9]+ passed' /tmp/pg_gate.txt; then
            echo "el gate de PostgreSQL no corrio ningun test"
            exit 1
          fi
          if grep -q 'skipped' /tmp/pg_gate.txt; then
            echo "el gate de PostgreSQL se salteo: falta LIBRAAUTH_POSTGRES_URL"
            exit 1
          fi
          echo "OK: el gate corrio contra PostgreSQL real"

  # F2 (2026-09-05): que el CI ponga rojo un commit con un secreto. Barre los
  # commits del PR (no toda la historia) con la configuracion de
  # `.gitleaks.toml` en la raiz, que exime `tests/` porque ahi viven las
  # contrasenas de prueba de la suite. Job independiente: corre en paralelo y
  # su rojo no se mezcla con el de la suite.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
